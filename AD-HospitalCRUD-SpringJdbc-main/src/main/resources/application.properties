spring.application.name=AD-HospitalCRUD-SpringJdbc

# En el fichero .env llevaremos las variables de entorno para la base de datos, usuario y contraseña
spring.config.import=optional:file:.env[.properties]

# Configuración de la conexión a la base de datos con los datos reales de respaldo
spring.datasource.url=${DB_URL:jdbc:mysql://dam2.mysql.iesquevedo.es:3335/daniel_antmann_hospital?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:quevedo2dam}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Logging de JdbcClient/JdbcTemplate para ver las consultas y parámetros en la consola
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE